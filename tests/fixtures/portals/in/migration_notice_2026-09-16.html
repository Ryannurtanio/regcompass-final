<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="3;url=https://indiacode.gov.in">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India Code - Site Migration</title>

    <script>
        setTimeout(function () {
            window.location.href = "https://indiacode.gov.in";
        }, 3000);
    </script>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 700px;
            padding: 40px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #003366;
            margin-bottom: 20px;
        }

        p {
            color: #444;
            font-size: 18px;
            line-height: 1.6;
        }

        .new-url {
            color: #0066cc;
            font-weight: bold;
            text-decoration: none;
        }

        .countdown {
            margin-top: 20px;
            color: #666;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>IndiaCode Website Migration</h1>

        <p>
            The India Code website has been migrated from
            <strong>https://www.indiacode.nic.in</strong> to
            <a class="new-url" href="https://indiacode.gov.in">
                https://indiacode.gov.in
            </a>.
        </p>

        <p>
            You will be automatically redirected to the new website in a few seconds.
        </p>

        <div class="countdown">
            Redirecting...
        </div>
    </div>
</body>
</html>
