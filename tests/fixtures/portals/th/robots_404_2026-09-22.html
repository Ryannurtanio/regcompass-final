<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>สำนักงานคณะกรรมการกฤษฎีกา</title>
    <style>
        * {
            font-family: BaiJamjuree, -apple-system, BlinkMacSystemFont, Segoe UI,
                Roboto, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji,
                Segoe UI Symbol;
            color: rgba(0, 0, 0, 0.75);
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100vh;
            padding: 0px 30px;
            background: #ddd;
        }

        .wrapper {
            max-width: 960px;
            width: 100%;
            margin: 30px auto;
            transform: scale(0.8);
        }

        .landing-page {
            max-width: 960px;
            height: 475px;
            margin: 0;
            box-shadow: 0px 0px 8px 1px #ccc;
            background: #fafafa;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-size: 48px;
            margin: 0;
        }

        p {
            font-size: 16px;
            width: 75%;
            margin: 16px auto 24px;
            text-align: center;
        }

        .button {
            background-color: #2196f3;
            border-color: #2196f3;
            border: none;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            color: white;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="landing-page">
            <div style="text-align:center;">
                <img src="/council-of-state/assets/images/logo-ocs.png">
            </div>
            <h1>404 Not Found</h1>
            <p>The requested file or page cannot be found at this address.</p>
            <a class="button" href="/council-of-state/">GO TO HOMEPAGE</a>
        </div>
    </div>

</html>
