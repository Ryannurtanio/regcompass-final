[project]
name = "regcompass"
version = "0.1.0"
description = "Maps national legislation to the UN ESCAP RDTII 2.1 framework with mechanical citation enforcement: the model only selects verbatim quotes; a byte-for-byte substring check rejects everything else."
license = "Apache-2.0"
# litellm (live extra) declares <3.14; the cap is inherited here so pip and uv agree.
requires-python = ">=3.12,<3.14"
# Base tier: the judge audit/CLI path. Wheel-only, small, keyless.
dependencies = [
    "typer==0.26.8",
    # rich powers the CLI stage banners + M6/M7 progress bar (already resolved
    # transitively via typer; promoted to a direct pinned dep so the import is
    # part of the contract). MIT, base-tier safe.
    "rich==15.0.0",
    "pydantic==2.13.4",
    "numpy==2.5.1",
    "pyyaml==6.0.3",
    # U0 audit UI backend (judge path: pre-built bundle served by FastAPI, pip only).
    "fastapi==0.139.0",
    "starlette==1.3.1",  # pinned explicitly; FastAPI's range must agree
    "uvicorn==0.50.0",  # bare (no [standard] extras): the audit server needs none of them
    # "Add document" uploads a PDF through a real file picker, which is a
    # multipart/form-data body; FastAPI parses those only when this is
    # installed. Apache-2.0, pure Python, base tier because adding a Document
    # by hand is the keyless reviewer path for a manual-acquisition Economy.
    "python-multipart==0.0.20",
    # The Evidence Export writes the organizer's own workbook (M9): openpyxl
    # opens config/organizer/OUTPUT_TEMPLATE_FINAL_ROUND.xlsx and fills the
    # Output Data sheet, leaving its formulas and validations alone. MIT,
    # wheel-only, base tier because `regcompass export` is the keyless judge path.
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
# Full pipeline tier: crawling, extraction, OCR, translation, gating, mapping.
live = [
    "litellm==1.91.0",
    "playwright==1.61.0",
    "curl-cffi==0.15.0",
    "httpx==0.28.1",
    "tenacity==9.1.4",
    "pdfplumber==0.11.10",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.1",
    "pytesseract==0.3.13",
    "pypdfium2==5.11.0",
    "rapidocr==3.9.1",
    "onnxruntime==1.27.0",  # rapidocr's ONNX engine backend (not declared by rapidocr)
    "pillow==12.3.0",  # pypdfium2 rasterization output + pytesseract input
    "ctranslate2==4.8.1",
    "sentencepiece==0.2.1",
    "bm25s==0.3.9",
]
# Production storage swap (docs/POSTGRES.md): pg8000 is pure Python and BSD;
# the psycopg family is LGPL, below the Apache-2.0-compatible license floor.
postgres = [
    "pg8000==1.31.5",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pip-licenses==5.5.5",
]

[project.scripts]
regcompass = "regcompass.cli:app"

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regcompass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running fixture runs (large compilations); always run in module VERIFY loops",
    "paid: calls a paid Engine and bills real money; needs REGCOMPASS_PAID=1 plus the key",
    "live: hits a real government portal over the network; opt in with REGCOMPASS_LIVE=1",
]
