      Host verified 16 Sep 2026; Mongolia has no Portal crawler.
      legalinfo.mn publishes no robots.txt (its /robots.txt is the 404 page)
      and serves real HTML, but every act list, including search results,
      arrives through an undocumented POST endpoint (/mn/ajaxList/) that
      returns pre-rendered markup; the server HTML carries only the category
      tree. The page advertised as an API reference is an article about the
      Constitution, not a published API, so there is no act list here we may
      build on. A law page, /mn/detail?lawId={id}, is whole server HTML in
      UTF-8, so a Discovery by Pillar fetches laws at their own addresses:
      the 2025 baseline's laws on these hosts and, since 29 Sep 2026, the
      laws seeded by lawId in crawl_seeds.yaml (Personal Data Protection
      16390288615991, Cybersecurity 16390365491061). Any other law arrives
      through "Add document". Mongolian traineddata is vendored
      (vendor/tessdata/mon.traineddata, read as mon+eng), so a scanned
      Mongolian upload is read by OCR like any other scan; a law page or a
      text-layer PDF is still the better source where one exists.
  RU:
    official_name: Russian Federation
    languages: [Russian]
    hosts:
      - pravo.gov.ru
      - kremlin.ru
      # The Eurasian Economic Commission (see KZ). It answers over https, so
      # it is not one of the http hosts below.
      - eec.eaeunion.org
    # Port 443 to pravo.gov.ru and kremlin.ru is closed on our network path;
    # port 80 answers. These two hosts, and only these, may be asked over
    # plain http.
    http_hosts:
      - pravo.gov.ru
      - kremlin.ru
    fetch_timeout_seconds: 60  # pravo.gov.ru takes 5 to 8 s for a whole act
    strategy: manual
    prepared: false
    live_test_pool: true
    min_interval_seconds: 2
    notes: >-
      Live-test pool, and formerly the documented fallback if Thailand missed
      its 20 Sep time box. The Coverage Matrix has NO row for the Russian
      Federation (organizer defect 5), so this spelling comes from the live-test
      pool list in the organizer's Instructions sheet.
      NETWORK NOTE: on 16 Sep 2026 publication.pravo.gov.ru timed out at the
      TCP connect on every attempt. On 22 Sep 2026 the cause was found: port
      443 is blocked on our network path to every Russian government host,
      while port 80 answers. Over HTTP the Portal has an open API
      (/api/Documents, /api/DocumentTypes), but its acts are image-only
      scanned PDFs and it publishes amendments, not consolidated law, so the
      fallback was examined and NOT taken.
      Added 29 Sep 2026: two official hosts over plain http. kremlin.ru
      (the President's acts bank): /acts/bank/{id}/print is the whole current
      text, UTF-8, robots allows /acts/bank/. pravo.gov.ru (the Official
      Internet Portal of Legal Information):
      /proxy/ips/?doc_itself=&nd={nd}&page=1 is the consolidated text in
      windows-1251, robots allows everything. Seeded in crawl_seeds.yaml:
      Federal Law 152-FZ On Personal Data (kremlin 24154, pravo nd
      102108261) and 149-FZ On Information (pravo nd 102108264). Plain http
      means no TLS protected the text in transit, and the Discovery record
      says so. If port 443 answers where RegCompass runs, https addresses on
      these hosts work too. Later the same day: kremlin.ru print pages for
      the federal laws the 2025 baseline cites on commercial mirrors (160-FZ,
      57-FZ, 236-FZ, the Civil Code Part Four, 98-FZ, 126-FZ, 99-FZ, 162-FZ,
      63-FZ), each tried ahead of the baseline's own address for that law;
      and the Eurasian Economic Commission (eec.eaeunion.org, see KZ) for
      the Union acts that bind the Russian Federation: Board Decision No. 30
      with its Annex 9, the Treaty's Annexes 8 and 9 and Section X, and the
      Customs Code. That host answers over https, so it is not an http host.
  TL:
    official_name: Timor-Leste
    # Portuguese is "Other" on the organizer's list; English for the
    # regulator's own guidelines and official translations.
    languages: [Other, English]
    hosts:
      # The Ministry of Justice's copy of the Jornal da República, the
      # official gazette (the gazette's own name, www.jornal.gov.tl, does
      # not resolve), under both of its names.
      - www.mj.gov.tl
      - mj.gov.tl
      # The Government's site: the Constitution in Portuguese and English.
      - timor-leste.gov.tl
      # Autoridade Nacional de Comunicações, the telecommunications regulator.
      - anc.tl
    fetch_timeout_seconds: 60  # gazette issues of up to 5 MB
    strategy: manual
    prepared: false
    live_test_pool: true
    min_interval_seconds: 3  # mj.gov.tl publishes crawl-delay 10, which raises it there
    notes: >-
      Added 30 Sep 2026; Timor-Leste has no 2025 baseline and no Portal
      crawler, so a Discovery by Pillar fetches the laws seeded at their
      official addresses in crawl_seeds.yaml. Laws are Portuguese (some
      Tetum beside them), read as "Other" with Portuguese OCR data (por+eng)
      and shortlisted by meaning. The Jornal da República is published by
      the Ministry of Justice at www.mj.gov.tl/jornal/public/docs/{year}/
      serie_1/{issue}.pdf: one PDF per issue with a text layer, often
      holding several acts, so each seed's title names the issue and the
      file pages its law sits on. robots.txt (Drupal default) allows
      /jornal/public/docs/ and asks for crawl-delay 10, which Discovery
      honours. timor-leste.gov.tl and anc.tl publish no robots.txt (404).
      Checked and not listed: www.jornal.gov.tl (no DNS), www.parlamento.tl
      (no answer on 443 or 80), bancocentral.tl (every path answers 302 to
      the home page). Any other law, including the Industrial Property Code
      once it is published, is uploaded by hand.
