  KZ:
    official_name: Kazakhstan
    # English last, so Add document offers it for a NATLEX translation added
    # by hand; Russian stays the default.
    languages: [Russian, Kazakh, English]
    hosts:
      - adilet.zan.kz
      # ILO NATLEX, intergovernmental repository of official texts.
      - natlex.ilo.org
      # The Eurasian Economic Commission, the Eurasian Economic Union's
      # executive body: its own PDFs of the Union's Treaty, Customs Code and
      # Commission decisions, which bind Kazakhstan as a member State.
      - eec.eaeunion.org
    strategy: manual
    prepared: false
    live_test_pool: true
    min_interval_seconds: 2
    notes: >-
      Host verified 16 Sep 2026; Kazakhstan has no Portal crawler. Legislation
      is published in both Kazakh and Russian; Russian is the default because
      the consolidated texts appear there first. The Portal's robots.txt is
      explicit (act pages open, /api/, /search and /advanced-search closed) and
      closes the whole site to model-training crawlers by name; RegCompass is
      not named, so the `*` group binds it. The act route answers a 2.7 KB
      shell whose own comment says the full text is withheld from non-browser
      clients on purpose, so that the system is cited rather than drained. A
      headless browser would render around that ask, so we do not: adilet
      Documents arrive through "Add document". Evidence:
      tests/fixtures/portals/kz/.
      Added 29 Sep 2026: ILO NATLEX, intergovernmental repository of official
      texts. Its download address
      /dyn/natlex2/natlex2/files/download/{isn}/KAZ-{isn}.pdf answers with
      the PDF, and robots.txt allows it; its detail pages sit behind a
      browser check, so they are never browsed and only seeded download
      addresses are fetched. Seeded: 96710, Law No. 94-V On Personal Data and
      their Protection, in the Ministry of Justice's unofficial English
      translation (amended to 30 Dec 2021), and 108188, the Entrepreneurial
      Code No. 375-V, in the unofficial English translation NATLEX holds, so
      their Language is English and their titles say they are translations.
      Also added 29 Sep 2026: the Eurasian Economic Commission
      (eec.eaeunion.org, over https), whose robots.txt allows /upload/. Its
      own PDFs carry a Russian text layer; seeded are the Treaty's Annex 8
      (trade remedies), Section XXII with Annex 25 (procurement), Section X
      and Annex 9 (technical regulation), Board Decision No. 30 on
      non-tariff measures with its Annex 9 (encryption means), and the
      Customs Code. docs.eaeunion.org, the Union's legal portal, is not
      listed: its robots.txt answered HTTP 500, which Discovery reads as a
      refusal. Any other Kazakh law is uploaded by hand.
